name: Generate Design Tokens

on:
  push:
    branches: [main]
    paths:
      - 'tokens-studio.json'
      - 'style-dictionary.config.js'
      - 'package.json'
      - '.github/workflows/generate-tokens.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Style Dictionary
        run: npm run build:tokens

      - name: Show generated files
        run: |
          echo "Generated files:"
          find dist -type f | sort
          echo ""
          echo "--- iOS (first 30 lines) ---"
          head -30 dist/ios/Tokens.swift || true
          echo ""
          echo "--- Android (first 30 lines) ---"
          head -30 dist/android/Tokens.kt || true

      - name: Open Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: regenerate design tokens"
          title: "[Design Tokens] Regenerate from tokens-studio.json"
          body: |
            ## Automated design tokens regeneration

            This PR was generated by `.github/workflows/generate-tokens.yml` after a change to `tokens-studio.json`.

            ### Generated files
            - `dist/ios/Tokens.swift` — Swift class for iOS
            - `dist/android/Tokens.kt` — Kotlin object for Android

            🤖 Generated by GitHub Actions.
          branch: design-tokens/regenerate
          delete-branch: true
          add-paths: dist/
