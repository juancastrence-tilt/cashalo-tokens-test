name: Generate Design Tokens

on:
  push:
    branches: [main]
    paths:
      - 'tokens-studio.json'
      - 'style-dictionary.config.js'
      - 'package.json'
      - '.github/workflows/generate-tokens.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (cashalo-tokens-test)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: source
        run: npm ci || npm install

      - name: Run Style Dictionary
        working-directory: source
        run: npm run build:tokens

      - name: Show generated files
        working-directory: source
        run: |
          echo "Generated files:"
          find dist -type f | sort
          echo ""
          echo "--- Android (first 30 lines) ---"
          head -30 dist/android/Tokens.kt

      - name: Checkout target (empowerfinance/cashalo-mobile)
        uses: actions/checkout@v4
        with:
          repository: empowerfinance/cashalo-mobile
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: target

      - name: Copy generated Tokens.kt into target repo
        run: |
          TARGET_DIR="target/empower-android-ph/empower-app/src/main/java/finance/empower/ph/designsystem/tokens"
          mkdir -p "$TARGET_DIR"
          cp source/dist/android/Tokens.kt "$TARGET_DIR/Tokens.kt"
          echo "Placed Tokens.kt at $TARGET_DIR/Tokens.kt"

      - name: Open Pull Request in target repo
        uses: peter-evans/create-pull-request@v6
        with:
          path: target
          token: ${{ secrets.CROSS_REPO_PAT }}
          commit-message: "chore: regenerate Android design tokens from Figma"
          title: "[Design Tokens] Regenerate Android tokens"
          body: |
            ## Automated design tokens regeneration

            This PR was generated by the design tokens pipeline in [`juancastrence-tilt/cashalo-tokens-test`](https://github.com/juancastrence-tilt/cashalo-tokens-test) after a change to `tokens-studio.json`.

            ### Generated file
            - `empower-android-ph/empower-app/src/main/java/finance/empower/ph/designsystem/tokens/Tokens.kt`

            ### How to review
            1. Confirm the regenerated values reflect the design system changes
            2. If the file path doesn't match where you want design tokens to live, move it and let @juancastrence-tilt know — we'll update the pipeline
            3. Merge when satisfied

            🤖 Automated. To regenerate, edit `tokens-studio.json` in the source repo and push.
          branch: design-tokens/regenerate-android
          delete-branch: true
          add-paths: empower-android-ph/empower-app/src/main/java/finance/empower/ph/designsystem/tokens/Tokens.kt
